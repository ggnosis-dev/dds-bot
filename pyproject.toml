[project]
name = "dds-bot"
version = "0.8.0"
description = ""
authors = [
    { name = "ggnosis-dev", email = "<ggnosis.var@pm.me>" }
]
license = "GPL-3.0"
requires-python = ">=3.14"
dependencies = [
    "discord-py (>=2.7.1)",
    "numpy (>=2.5.2)",
    "python-dotenv (>=1.2.2)"
]

[dependency-groups]
dev = [
    "pillow (>=12.3.0,<13.0.0)"
]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C4", "UP"]
ignore = ["E101", "W191"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
lines-between-types = 1

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
